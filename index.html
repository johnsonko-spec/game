<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日挑戰 Daily Challenge - 網頁版益智遊戲平台</title>
  <meta name="description" content="每日精選益智關卡，包含麻將聽牌、撲克記憶、動物連連看、迷你數獨與青蛙擺放解謎！每天一關，挑戰全網排名！">
  <meta name="keywords" content="麻將聽牌, 撲克記憶, 動物連連看, 迷你數獨, 青蛙擺放, Frogdoku, 每日挑戰, 益智遊戲, 網頁遊戲, 排行榜">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/mahjong.css">
  <link rel="stylesheet" href="css/memory.css">
  <link rel="stylesheet" href="css/connect.css">
  <link rel="stylesheet" href="css/sudoku.css">
  <link rel="stylesheet" href="css/frogdoku.css">
</head>
<body>

  <div class="app-container">
    <!-- Header Title -->
    <header class="app-header">
      <h1 class="brand-title">🎮 每日挑戰</h1>
      <p class="brand-subtitle">每天一個新關卡，考驗你的極速反應與邏輯解謎！</p>
    </header>

    <!-- Stage Navigation Bar -->
    <div class="stage-nav-bar" style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      <button id="prev-stage-btn" class="btn-icon" style="padding:0.5rem 1rem;">⬅️ 上一關 (上一天)</button>
      <div style="background:rgba(0,0,0,0.3); border:1px solid var(--border-glass); padding:0.5rem 1.25rem; border-radius:var(--radius-md); font-weight:700; font-size:0.95rem;">
        📅 關卡日期: <strong id="current-stage-date" style="color:var(--accent-cyan);">2026-08-25</strong>
      </div>
      <button id="next-stage-btn" class="btn-icon" style="padding:0.5rem 1rem; background:rgba(0,242,254,0.15); border-color:var(--accent-cyan); color:var(--accent-cyan);">➡️ 下一關 (下一天)</button>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
      <div class="player-input-group">
        <label for="player-name-input" class="player-label">👤 玩家姓名：</label>
        <input 
          type="text" 
          id="player-name-input" 
          class="player-input" 
          placeholder="請輸入你的名字 (隨時可更改)"
          maxlength="20"
          autocomplete="off"
        >
      </div>
      <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
        <button id="reset-all-records-btn" class="btn-icon" style="background:rgba(255,82,82,0.15); border-color:rgba(255,82,82,0.4); color:#ff5252; font-size:0.85rem;" title="一鍵清除所有遊玩紀錄重新測試">
          🧹 清除紀錄與重置
        </button>
        <div class="player-status-hint">
          ⚡ 更改名字即時生效，全網跨裝置實時對決
        </div>
      </div>
    </div>

    <!-- 6 Game Cards Grid -->
    <main id="cards-grid" class="cards-grid">
      <!-- Dynamically rendered by app.js -->
    </main>

    <!-- Option C Full-Area Game Expansion Overlay Container -->
    <div id="full-game-overlay" class="full-game-overlay">
      <!-- Embedded Game UI, Ad Sponsor Screen, or Leaderboard rendered here -->
    </div>
  </div>

  <!-- Firebase SDKs for Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- JavaScript Modules -->
  <script src="js/daily-seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/leaderboard.js"></script>

  <!-- Mahjong Game Modules -->
  <script src="js/games/mahjong/mahjong-tiles.js"></script>
  <script src="js/games/mahjong/mahjong-solver.js"></script>
  <script src="js/games/mahjong/mahjong-generator.js"></script>
  <script src="js/games/mahjong/mahjong-game.js"></script>

  <!-- Memory Game Modules -->
  <script src="js/games/memory/memory-game.js"></script>

  <!-- Connect Game Modules -->
  <script src="js/games/connect/connect-pathfinder.js"></script>
  <script src="js/games/connect/connect-game.js"></script>

  <!-- Sudoku Game Modules -->
  <script src="js/games/sudoku/sudoku-solver.js"></script>
  <script src="js/games/sudoku/sudoku-game.js"></script>

  <!-- Frogdoku Game Modules -->
  <script src="js/games/frogdoku/frogdoku-generator.js"></script>
  <script src="js/games/frogdoku/frogdoku-game.js"></script>

  <!-- Sponsor Ad Module -->
  <script src="js/ad-sponsor.js"></script>

  <!-- Main App Script -->
  <script src="js/app.js"></script>

</body>
</html>
