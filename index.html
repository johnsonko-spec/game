<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日挑戰 Daily Challenge - 網頁版益智遊戲平台</title>
  <meta name="description" content="每日精選益智關卡，首發台灣16張麻將聽牌解謎！每天一關，挑戰全網排名！">
  <meta name="keywords" content="麻將聽牌, 台灣麻將, 每日挑戰, 益智遊戲, 網頁遊戲, 排行榜">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/mahjong.css">
</head>
<body>

  <div class="app-container">
    <!-- Header Title -->
    <header class="app-header">
      <h1 class="brand-title">🎮 每日挑戰</h1>
      <p class="brand-subtitle">每天一個新關卡，考驗你的極速反應與邏輯解謎！</p>
    </header>

    <!-- Player Bar -->
    <div class="player-bar">
      <div class="player-input-group">
        <label for="player-name-input" class="player-label">👤 玩家姓名：</label>
        <input 
          type="text" 
          id="player-name-input" 
          class="player-input" 
          placeholder="請輸入你的名字 (隨時可更改)"
          maxlength="20"
          autocomplete="off"
        >
      </div>
      <div class="player-status-hint">
        ⚡ 更改名字即時生效，全網跨裝置實時對決
      </div>
    </div>

    <!-- 6 Game Cards Grid -->
    <main id="cards-grid" class="cards-grid">
      <!-- Dynamically rendered by app.js -->
    </main>

    <!-- Option C Full-Area Game Expansion Overlay Container -->
    <div id="full-game-overlay" class="full-game-overlay">
      <!-- Embedded Game UI or Leaderboard rendered here -->
    </div>
  </div>

  <!-- Firebase SDKs for Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- JavaScript Modules -->
  <script src="js/daily-seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/leaderboard.js"></script>

  <!-- Mahjong Game Modules -->
  <script src="js/games/mahjong/mahjong-tiles.js"></script>
  <script src="js/games/mahjong/mahjong-solver.js"></script>
  <script src="js/games/mahjong/mahjong-generator.js"></script>
  <script src="js/games/mahjong/mahjong-game.js"></script>

  <!-- Main App Script -->
  <script src="js/app.js"></script>

</body>
</html>
